# Build Windows .exe + NSIS installers for Dubora desktop.
# Pushes to main build x64/x86 and publish a GitHub Release; manual runs build
# and upload artifacts for inspection.

name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "scripts/changelog-release.py"
      - "scripts/prepare-ffmpeg-windows.ps1"
      - "scripts/prepare-ytdlp-windows.ps1"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Stage bundled FFmpeg (rubberband)
        shell: pwsh
        run: .\scripts\prepare-ffmpeg-windows.ps1

      - name: Stage bundled yt-dlp
        shell: pwsh
        run: .\scripts\prepare-ytdlp-windows.ps1

      - name: Build Tauri app (NSIS)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: apps/desktop
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Collect Windows executables
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          $roots = @(
            "target/$env:BUILD_TARGET/release",
            "apps/desktop/src-tauri/target/$env:BUILD_TARGET/release",
            "target/release",
            "apps/desktop/src-tauri/target/release"
          )
          $files = @(
            foreach ($root in $roots) {
              if (Test-Path $root) {
                Get-ChildItem -Path $root -Filter "*.exe" -File -Recurse -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.FullName -match "[\\/]bundle[\\/]nsis[\\/]" -or $_.Name -eq "dubora.exe"
                }
              }
            }
          ) | Sort-Object FullName -Unique
          $files = @($files)

          if ($files.Count -eq 0) {
            throw "No Windows executables found for $env:BUILD_TARGET"
          }

          $stage = Join-Path $env:GITHUB_WORKSPACE "release-assets/$env:BUILD_ARCH"
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($file in $files) {
            $kind = if ($file.FullName -match "[\\/]bundle[\\/]nsis[\\/]") { "installer" } else { "portable" }
            $destination = Join-Path $stage "Dubora-$env:BUILD_ARCH-$kind-$($file.Name)"
            Copy-Item $file.FullName $destination -Force
            if ($kind -eq "installer") {
              $signature = "$($file.FullName).sig"
              if (-not (Test-Path $signature)) { throw "Missing updater signature for $($file.FullName)" }
              Copy-Item $signature "$destination.sig" -Force
            }
            Write-Host "Staged $destination"
          }

      - name: Upload ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dubora-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release-assets/${{ matrix.arch }}/*.exe
            release-assets/${{ matrix.arch }}/*.sig
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dubora-windows-*
          path: release-assets
          merge-multiple: true

      - name: Read version and notes from CHANGELOG
        id: changelog
        run: |
          version="$(python3 scripts/changelog-release.py version)"
          tag="$(python3 scripts/changelog-release.py tag)"
          title="$(python3 scripts/changelog-release.py title)"
          python3 scripts/changelog-release.py notes > "$RUNNER_TEMP/release-notes.md"
          cat >> "$RUNNER_TEMP/release-notes.md" <<'EOF'

          ### Mã nguồn bên thứ ba

          - FFmpeg: https://github.com/FFmpeg/FFmpeg/commit/74e4393595
          - yt-dlp: https://github.com/yt-dlp/yt-dlp/tree/2026.11.23
          - Thông tin phiên bản và giấy phép: THIRD_PARTY_NOTICES.md trong tài sản release.

          Các link trên là repo upstream; chưa xác minh đầy đủ source tương ứng cho mọi thư viện và công cụ build trong binary đóng gói.
          EOF
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "Using CHANGELOG ${tag} (${title})"
          echo "----- notes -----"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
          RELEASE_TITLE: ${{ steps.changelog.outputs.title }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -name '*.exe' -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No .exe release assets found" >&2
            exit 1
          fi
          release_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$release_draft" == "false" ]]; then
            echo "GitHub Release ${RELEASE_TAG} already exists; skip. Bump CHANGELOG.md to publish again."
            exit 0
          fi
          git fetch --no-tags origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" 2>/dev/null || true
          tagged_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{}" 2>/dev/null || true)"
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo "::warning::Release unchanged: build commit differs from tag; create a new version."
            exit 0
          fi
          if [[ "$release_draft" == "true" ]]; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" THIRD_PARTY_NOTICES.md LICENSE --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" THIRD_PARTY_NOTICES.md LICENSE \
              --draft --target "$GITHUB_SHA" --title "$RELEASE_TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          python3 - <<'PYMANIFEST'
          import glob, json, os
          from pathlib import Path
          platforms = {}
          for arch, target in [('x64', 'windows-x86_64'), ('x86', 'windows-i686')]:
              paths = glob.glob(f'release-assets/Dubora-{arch}-installer-*.exe')
              if len(paths) != 1:
                  raise SystemExit(f'Expected one {arch} installer, found {len(paths)}')
              path = Path(paths[0])
              signature = Path(str(path) + '.sig').read_text().strip()
              platforms[target] = {'url': f'https://github.com/hoangtuan2k5/dubora/releases/download/{os.environ["RELEASE_TAG"]}/{path.name}', 'signature': signature}
          Path('latest.json').write_text(json.dumps({'version': os.environ['RELEASE_TAG'].removeprefix('v'), 'platforms': platforms}, indent=2))
          PYMANIFEST
          gh release upload "$RELEASE_TAG" latest.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
