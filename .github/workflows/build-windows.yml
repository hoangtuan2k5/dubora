# Build Windows .exe + NSIS installer for Dubora desktop.
# Trigger: manual (workflow_dispatch) or push to main touching desktop/core.

name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/prepare-ffmpeg-windows.ps1"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Stage bundled FFmpeg (rubberband)
        shell: pwsh
        run: .\scripts\prepare-ffmpeg-windows.ps1

      - name: Build Tauri app (NSIS)
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Locate artifacts
        id: artifacts
        shell: pwsh
        run: |
          $candidates = @(
            "target/release/bundle/nsis",
            "apps/desktop/src-tauri/target/release/bundle/nsis",
            "target/release",
            "apps/desktop/src-tauri/target/release"
          )
          Get-ChildItem -Path $candidates -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName |
            ForEach-Object { Write-Host $_ }

      - name: Upload installer and exe
        uses: actions/upload-artifact@v4
        with:
          name: dubora-windows
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            target/release/dubora.exe
            apps/desktop/src-tauri/target/release/dubora.exe
          retention-days: 14
