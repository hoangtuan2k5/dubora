# Build Windows .exe + NSIS installers for Dubora desktop.
# Pushes to main build x64/x86 and publish a GitHub Release; manual runs build
# and upload artifacts for inspection.

name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "CHANGELOG.md"
      - "scripts/changelog-release.py"
      - "scripts/prepare-ffmpeg-windows.ps1"
      - "scripts/prepare-ytdlp-windows.ps1"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: x86
            target: i686-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Stage bundled FFmpeg (rubberband)
        shell: pwsh
        run: .\scripts\prepare-ffmpeg-windows.ps1

      - name: Stage bundled yt-dlp
        shell: pwsh
        run: .\scripts\prepare-ytdlp-windows.ps1

      - name: Build Tauri app (NSIS)
        working-directory: apps/desktop
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Collect Windows executables
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          $roots = @(
            "target/$env:BUILD_TARGET/release",
            "apps/desktop/src-tauri/target/$env:BUILD_TARGET/release",
            "target/release",
            "apps/desktop/src-tauri/target/release"
          )
          $files = @(
            foreach ($root in $roots) {
              if (Test-Path $root) {
                Get-ChildItem -Path $root -Filter "*.exe" -File -Recurse -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.FullName -match "[\\/]bundle[\\/]nsis[\\/]" -or $_.Name -eq "dubora.exe"
                }
              }
            }
          ) | Sort-Object FullName -Unique
          $files = @($files)

          if ($files.Count -eq 0) {
            throw "No Windows executables found for $env:BUILD_TARGET"
          }

          $stage = Join-Path $env:GITHUB_WORKSPACE "release-assets/$env:BUILD_ARCH"
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($file in $files) {
            $kind = if ($file.FullName -match "[\\/]bundle[\\/]nsis[\\/]") { "installer" } else { "portable" }
            $destination = Join-Path $stage "Dubora-$env:BUILD_ARCH-$kind-$($file.Name)"
            Copy-Item $file.FullName $destination -Force
            Write-Host "Staged $destination"
          }

      - name: Upload ${{ matrix.arch }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dubora-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: release-assets/${{ matrix.arch }}/*.exe
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dubora-windows-*
          path: release-assets
          merge-multiple: true

      - name: Read version and notes from CHANGELOG
        id: changelog
        run: |
          version="$(python3 scripts/changelog-release.py version)"
          tag="$(python3 scripts/changelog-release.py tag)"
          title="$(python3 scripts/changelog-release.py title)"
          python3 scripts/changelog-release.py notes > "$RUNNER_TEMP/release-notes.md"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"
          echo "Using CHANGELOG ${tag} (${title})"
          echo "----- notes -----"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
          RELEASE_TITLE: ${{ steps.changelog.outputs.title }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -name '*.exe' -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No .exe release assets found" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists; skip. Bump CHANGELOG.md to publish again."
            exit 0
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
