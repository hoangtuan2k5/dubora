name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Test Python pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest python_reference.tests.test_run_dub
          python -m py_compile run_dub.py clean_rolling.py generate_tts.py translate_srt.py build_audio.py build_video.py drive_helper.py
          python -m py_compile python_reference/dubora_reference/*.py python_reference/tests/test_run_dub.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Test Rust core and CLI
        run: cargo test -p dubora-core -p dubora-cli

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
