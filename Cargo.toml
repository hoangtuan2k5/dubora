[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/dubora-core",
    "crates/dubora-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Hoàng Chiều Nguyễn Tuấn <tuan@hoangtuan.dev>"]
repository = "https://github.com/hoangtuan2k5/dubora"
homepage = "https://github.com/hoangtuan2k5/dubora"
documentation = "https://github.com/hoangtuan2k5/dubora"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
